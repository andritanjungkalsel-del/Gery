<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Outbreak 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="panel">
    <h1>🧟 ZOMBIE OUTBREAK 3D</h1>
    <p>Survive selama mungkin. Hancurkan semua zombie.</p>
    <button id="start">MULAI GAME</button>
    <div class="help">HP: joystick kiri • Arah kamera: geser kanan • Tembak: 🔥 • Reload: ↻</div>
  </div>
</div>
<div id="hud">
  <div class="top">
    <div>❤️ <span id="hp">100</span></div>
    <div>🔫 <span id="ammo">12</span>/<span id="reserve">60</span></div>
    <div>☠️ <span id="score">0</span></div>
    <div>🌊 Wave <span id="wave">1</span></div>
  </div>
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div class="buttons">
    <button id="jump">⬆</button>
    <button id="reload">↻</button>
    <button id="fire">🔥</button>
  </div>
</div>
<div id="gameover" class="screen hidden">
 <div class="panel">
  <h1>GAME OVER</h1>
  <p>Skor: <b id="finalScore">0</b></p>
  <button id="again">MAIN LAGI</button>
 </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
